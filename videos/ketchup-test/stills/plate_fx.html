<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}svg{position:absolute;left:0;top:0;width:1080px;height:1920px}</style></head><body>
    <svg id="s1-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer>
      </filter>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="w"/>
        <feDisplacementMap in="SourceGraphic" in2="w" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="soft4"><feGaussianBlur stdDeviation="4"/></filter>
      <filter id="soft8"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="soft16"><feGaussianBlur stdDeviation="16"/></filter>
      <filter id="soft40"><feGaussianBlur stdDeviation="40"/></filter>
    
        <linearGradient id="s1-wall" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#f6cf9f"/><stop offset="0.6" stop-color="#e2a377"/><stop offset="1" stop-color="#b77565"/>
        </linearGradient>
        <linearGradient id="s1-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe9ba"/><stop offset="1" stop-color="#ffb877"/>
        </linearGradient>
        <radialGradient id="s1-vig" cx="0.35" cy="0.3" r="0.95">
          <stop offset="0.5" stop-color="#2a1430" stop-opacity="0"/><stop offset="1" stop-color="#2a1430" stop-opacity="0.5"/>
        </radialGradient>
      </defs>
      <g id="s1-cam" transform="rotate(-4 540 900)">
        
        
        
        
      </g>
      <rect width="1080" height="1920" fill="url(#s1-vig)"/>
      <rect width="1080" height="1920" filter="url(#grain)" opacity="0.55" style="mix-blend-mode:multiply"/>
    </svg></body></html>
