<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
      <div id="shot" data-composition-id="shot" data-composition-src="compositions/shot.html"
        data-start="0" data-duration="2.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="2.6" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 10"></div>
      <audio id="vo" src="assets/voice.wav" data-start="0" data-duration="2.6" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx-squirt" src="assets/squirt.wav" data-start="1.04" data-duration="0.4" data-track-index="4" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
